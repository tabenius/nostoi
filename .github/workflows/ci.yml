name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test (with the Python conformance checks)
        run: cargo test
      - name: The verifier alone builds (no default features)
        run: cargo build --no-default-features --lib
  interoperability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2, wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install maturin
      - run: maturin build --manifest-path bindings/python/Cargo.toml --out dist
      - run: python -m pip install dist/*.whl
      - run: mkdir -p /tmp/nostoi-interop
      - run: python -m unittest discover -s bindings/python/tests -v
        env:
          NOSTOI_INTEROP_DIR: /tmp/nostoi-interop
      - run: cargo build --no-default-features --lib --target wasm32-unknown-unknown --locked
      - run: npm ci && npm run build && npm test
        working-directory: bindings/javascript
        env:
          NOSTOI_INTEROP_DIR: /tmp/nostoi-interop
      - name: JavaScript output verifies in Python
        run: |
          python - <<'PY'
          from pathlib import Path
          import nostoi
          assert nostoi.verify_jsonl(Path('/tmp/nostoi-interop/javascript.jsonl').read_text())['verified'] == 2
          PY
      - run: cargo publish --dry-run --locked
