name: Nostoi release candidate
on:
  pull_request:
    paths: ['release-registry.json', '.github/workflows/registry-candidate.yml']
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build CLI/TUI release binary
        run: |
          cargo build --release --locked
          target/release/nostoi --help > /tmp/nostoi-help
          test -s /tmp/nostoi-help
          mkdir -p dist
          cp target/release/nostoi dist/nostoi-linux-amd64
          chmod 755 dist/nostoi-linux-amd64
          cd dist
          sha256sum nostoi-linux-amd64 > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Validate registry contract
        run: |
          python3 - <<'PY'
          import json
          data=json.load(open('release-registry.json'))
          assert data['product']=='nostoi'
          assert data['promotion']['automaticStable'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nostoi-candidate-cli-tui-linux-amd64
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release-candidate:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package-smoke
    runs-on: ubuntu-24.04
    environment: release-candidate
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: nostoi-candidate-cli-tui-linux-amd64
          path: release-assets
      - name: Check semantic version agrees with package definition
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open('Cargo.toml','rb') as handle:
              config=tomllib.load(handle)
          version=config['package']['version']
          assert os.environ['GITHUB_REF_NAME']=='v'+version
          PY
      - name: Generate source-bound manifest and verify checksums
        run: |
          cd release-assets
          sha256sum --check SHA256SUMS
          cd ..
          python scripts/create_registry_release.py nostoi linux-amd64 release-assets
      - uses: sigstore/cosign-installer@v3
      - name: Sign with GitHub Actions tag identity
        run: cosign sign-blob --yes --bundle release-assets/release.sigstore.json release-assets/release.json
      - name: Publish signed candidate artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease \
            --title "nostoi $GITHUB_REF_NAME (candidate)" --generate-notes release-assets/*
