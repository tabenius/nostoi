[package]
name = "nostoi"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Tamper-evident audit chains: verify, append, stream and browse them (library, CLI and TUI)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tabenius/nostoi"
keywords = ["audit", "hash-chain", "tamper-evident", "ledger", "sqlite"]
categories = ["cryptography", "command-line-utilities", "database"]
readme = "README.md"

[lib]
name = "nostoi"
path = "src/lib.rs"

[[bin]]
name = "nostoi"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli", "tui", "sqlite"]
# SQLite stores: the native append-only store and Ephor's kagp-audit-v1 table.
sqlite = ["dep:rusqlite"]
cli = ["dep:clap"]
tui = ["cli", "dep:ratatui", "dep:crossterm"]

[dependencies]
# arbitrary_precision keeps every number exactly as written, so a record
# re-encodes to the very bytes its producer hashed (Python floats, big ints).
serde_json = { version = "1", features = ["arbitrary_precision"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
rusqlite = { version = "0.40", features = ["bundled", "functions"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }

[dev-dependencies]
tempfile = "3"
