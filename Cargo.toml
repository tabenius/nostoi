[package]
name = "nostoi"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Tamper-evident audit chains: verify, append, stream and browse them (library, CLI and TUI)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tabenius/nostoi"
keywords = ["audit", "hash-chain", "tamper-evident", "ledger", "sqlite"]
categories = ["cryptography", "command-line-utilities", "database"]
readme = "README.md"
include = ["/src/**", "/tests/*.rs", "/docs/**", "/examples/**", "/contrib/python/nostoi.py", "/contrib/systemd/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE-*", "/assets/logo.svg"]
# `/tests/*.rs` rather than `/tests/**`, because the attestation suite keeps a
# committed key pair so its fingerprint can be a known answer. Cargo ignores
# `exclude` entirely when `include` is present, so the narrowing has to happen
# here. A passphrase-less private key has no business in a published artifact: it
# trains everyone to ignore secret-scanner alerts, and it would sign something
# that looks legitimate. It stays in the repository, and CI checks it is never
# packaged.

[workspace]
members = ["bindings/python", "bindings/component", "crates/nostoi-core", "crates/nostoi-anchor", "crates/nostoi-kmsg"]
default-members = ["."]
resolver = "2"

[lib]
name = "nostoi"
path = "src/lib.rs"

[[bin]]
name = "nostoi"
path = "src/main.rs"
required-features = ["cli"]

[[example]]
name = "scale"
required-features = ["sqlite"]

[[example]]
name = "large_chain"
required-features = ["sqlite"]

[features]
default = ["cli", "tui", "sqlite"]
sqlite = ["dep:rusqlite", "nostoi-core/sqlite", "nostoi-anchor?/sqlite", "nostoi-kmsg?/sqlite"]
cli = ["dep:clap"]
tui = ["cli", "dep:ratatui", "dep:crossterm"]
kmsg = ["dep:nostoi-kmsg"]
s3 = ["dep:nostoi-anchor"]

[dependencies]
nostoi-core = { version = "0.1.0", path = "crates/nostoi-core", default-features = false }
nostoi-anchor = { version = "0.1.0", path = "crates/nostoi-anchor", default-features = false, optional = true }
nostoi-kmsg = { version = "0.1.0", path = "crates/nostoi-kmsg", default-features = false, optional = true }
rusqlite = { version = "0.40", features = ["bundled", "functions"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }
thiserror = "2"
serde_json = { version = "1", features = ["arbitrary_precision"] }

[dev-dependencies]
tempfile = "3"
