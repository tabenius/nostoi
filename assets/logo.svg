<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Nostoi</title>
  <desc id="desc">A duckling carries Gretel across a river; its wake is a trail of linked rings, a chain carried safely home.</desc>
  <defs>
    <clipPath id="disc"><circle cx="128" cy="128" r="120"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf6e3"/>
      <stop offset="1" stop-color="#f3e3bd"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b9fc7"/>
      <stop offset="1" stop-color="#2f6f95"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#disc)">
    <rect width="256" height="256" fill="url(#sky)"/>
    <!-- far bank: the way home -->
    <path d="M0 150 C40 138 70 144 104 140 C150 134 200 142 256 132 L256 170 L0 170 Z" fill="#9dbf7a"/>
    <circle cx="214" cy="120" r="14" fill="#6f9a52"/>
    <circle cx="228" cy="126" r="11" fill="#5f8a45"/>
    <rect x="210" y="128" width="4" height="12" fill="#7a5a3a"/>
    <!-- river -->
    <rect y="160" width="256" height="96" fill="url(#water)"/>
    <path d="M0 176 q16 -6 32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0" fill="none" stroke="#a9d3ea" stroke-width="3" stroke-linecap="round" opacity=".7"/>
    <path d="M0 228 q16 -6 32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0" fill="none" stroke="#a9d3ea" stroke-width="3" stroke-linecap="round" opacity=".45"/>

    <!-- the wake: linked rings, oldest farthest back -->
    <g fill="none" stroke="#e8f4fb" stroke-width="3.5">
      <ellipse cx="30" cy="198" rx="9" ry="5" opacity=".35"/>
      <ellipse cx="45" cy="198" rx="9" ry="5" opacity=".5"/>
      <ellipse cx="60" cy="198" rx="9" ry="5" opacity=".65"/>
      <ellipse cx="75" cy="198" rx="9" ry="5" opacity=".8"/>
      <ellipse cx="90" cy="198" rx="9" ry="5" opacity=".95"/>
    </g>

    <!-- duckling: body and head (the wing is drawn over Gretel's legs, below) -->
    <g>
      <ellipse cx="148" cy="204" rx="50" ry="11" fill="#1f5575" opacity=".35"/>
      <path d="M98 186 C98 160 128 150 160 154 C186 157 198 172 194 186 C190 201 170 207 148 207 C120 207 98 200 98 186 Z" fill="#f7c948"/>
      <path d="M102 178 C94 170 92 160 98 155 C102 165 108 170 114 172 Z" fill="#f7c948"/>
      <circle cx="182" cy="140" r="22" fill="#f7c948"/>
      <path d="M200 139 C214 139 223 143 223 147 C219 153 208 154 199 150 Z" fill="#f08a24"/>
      <circle cx="189" cy="134" r="3.8" fill="#2b2b2b"/>
      <circle cx="190.3" cy="132.7" r="1.2" fill="#fff"/>
      <path d="M172 121 C171 115 175 111 179 113" fill="none" stroke="#e8b23a" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Gretel, riding home -->
    <g>
      <!-- braids behind her -->
      <path d="M128 122 C119 132 118 146 121 156" fill="none" stroke="#d99a2b" stroke-width="6" stroke-linecap="round"/>
      <path d="M154 122 C162 132 163 144 160 152" fill="none" stroke="#d99a2b" stroke-width="6" stroke-linecap="round"/>
      <path d="M117 157 l4 -4 l4 4 l-4 4 Z" fill="#c8453c"/>
      <path d="M156 153 l4 -4 l4 4 l-4 4 Z" fill="#c8453c"/>
      <!-- dress, seated in the feathers -->
      <path d="M131 142 C128 150 122 164 120 178 L162 178 C160 164 154 150 151 142 C146 139 136 139 131 142 Z" fill="#c8453c"/>
      <path d="M135 150 C133 158 131 168 130 176 L152 176 C151 168 149 158 147 150 Z" fill="#fbf4e6"/>
      <!-- legs and shoes, under the wing -->
      <path d="M134 176 C140 184 146 188 152 190" fill="none" stroke="#f1c7a8" stroke-width="6" stroke-linecap="round"/>
      <path d="M146 176 C152 182 158 186 164 188" fill="none" stroke="#f1c7a8" stroke-width="6" stroke-linecap="round"/>
      <!-- one hand on the duckling's neck, one on its back -->
      <path d="M150 148 C157 150 163 148 167 144" fill="none" stroke="#f1c7a8" stroke-width="5.5" stroke-linecap="round"/>
      <circle cx="168" cy="143" r="3.6" fill="#f1c7a8"/>
      <path d="M132 148 C127 156 124 162 122 168" fill="none" stroke="#f1c7a8" stroke-width="5.5" stroke-linecap="round"/>
      <circle cx="121" cy="170" r="3.6" fill="#f1c7a8"/>
      <!-- head, looking ahead to the far bank -->
      <circle cx="141" cy="124" r="15" fill="#f1c7a8"/>
      <path d="M126 123 C125 107 157 105 157 122 C151 113 133 112 126 123 Z" fill="#e0a93b"/>
      <circle cx="147" cy="124" r="2" fill="#2b2b2b"/>
      <path d="M145 131 Q148.5 133.5 152 131" fill="none" stroke="#a35d4a" stroke-width="1.7" stroke-linecap="round"/>
      <circle cx="152" cy="127" r="2.6" fill="#f09a8a" opacity=".6"/>
    </g>

    <!-- the duckling's wing, over Gretel's legs -->
    <path d="M118 180 C132 168 162 168 178 182 C166 194 138 196 118 180 Z" fill="#e8b23a"/>
    <path d="M150 190 l6 -2 l1 5 Z" fill="#6b3f2a"/>
    <path d="M162 187 l6 -2 l1 5 Z" fill="#6b3f2a"/>
  </g>
  <circle cx="128" cy="128" r="120" fill="none" stroke="#2f6f95" stroke-width="6"/>
</svg>
