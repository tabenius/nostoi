[package]
name = "nostoi-python"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
nostoi = { path = "../..", default-features = false, features = ["sqlite"] }
nostoi-core = { path = "../../crates/nostoi-core", default-features = false }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
serde_json = "1"
