[package]
name = "nostoi-anchor"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "S3-compatible checkpoint publishing, verification and durable recovery"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tabenius/nostoi"
include = ["/src/**", "/tests/**", "/Cargo.toml", "/Cargo.lock"]

[features]
default = []
cli = ["dep:clap"]
sqlite = ["nostoi-core/sqlite", "dep:rusqlite"]

[[bin]]
name = "nostoi-anchor"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
nostoi-core = { version = "0.1.0", path = "../nostoi-core", default-features = false }
serde_json = { version = "1", features = ["arbitrary_precision"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
ureq = "3"
hmac = "0.12"
base64 = "0.22"
clap = { version = "4", features = ["derive"], optional = true }
rusqlite = { version = "0.40", features = ["bundled", "functions"], optional = true }

[dev-dependencies]
tempfile = "3"
