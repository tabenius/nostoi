[package]
name = "nostoi-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Portable hash-chain formats, streaming verification and local audit storage"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tabenius/nostoi"
include = ["/src/**", "/tests/**", "/Cargo.toml", "/Cargo.lock"]

[features]
default = []
sqlite = ["dep:rusqlite"]

[dependencies]
serde_json = { version = "1", features = ["arbitrary_precision"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
rusqlite = { version = "0.40", features = ["bundled", "functions"], optional = true }

[dev-dependencies]
tempfile = "3"
