[package]
name = "nostoi-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Portable hash-chain formats, streaming verification and local audit storage"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tabenius/nostoi"
include = ["/src/**", "/tests/**", "/Cargo.toml", "/Cargo.lock"]

[features]
default = []
sealed = ["dep:chacha20poly1305", "dep:getrandom", "dep:tempfile", "dep:zeroize"]
sqlite = ["dep:rusqlite"]

[dependencies]
serde_json = { version = "1", features = ["arbitrary_precision"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
# Signature verification, so a bundle can be checked without `ssh-keygen`: a
# WebAssembly component has no subprocesses and a browser has no filesystem.
# Pure Rust, so it compiles for every target this crate does.
ed25519-dalek = "2"
base64 = "0.22"
thiserror = "2"
# Sealed (crypto-shredding) fields: XChaCha20-Poly1305, a pure-Rust AEAD with a
# 24-byte nonce, so a fresh random nonce per seal is safe. Keys are per data
# subject; deleting a key erases every field it sealed without touching the
# chain, whose digests cover the ciphertext.
chacha20poly1305 = { version = "0.11", optional = true }
getrandom = { version = "0.3", optional = true }
tempfile = { version = "3", optional = true }
zeroize = { version = "1", features = ["derive"], optional = true }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
# Only for attestations: to check that a string is NFC. Record canonicalization
# is unchanged, so no existing chain's digests move.
unicode-normalization = "0.1"
rusqlite = { version = "0.40", features = ["bundled", "functions"], optional = true }

[dev-dependencies]
tempfile = "3"
