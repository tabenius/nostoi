[package]
name = "nostoi-kmsg"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Linux kernel ring-buffer ingestion into Nostoi audit chains"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tabenius/nostoi"
include = ["/src/**", "/tests/**", "/Cargo.toml", "/Cargo.lock"]

[features]
default = []
cli = ["dep:clap"]
sqlite = ["nostoi-core/sqlite"]

[[bin]]
name = "kmsg-nostoi"
path = "src/main.rs"
required-features = ["cli", "sqlite"]

[dependencies]
nostoi-core = { version = "0.1.0", path = "../nostoi-core", default-features = false }
serde_json = { version = "1", features = ["arbitrary_precision"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
libc = "0.2"
signal-hook = "0.3"
clap = { version = "4", features = ["derive"], optional = true }
rusqlite = { version = "0.40", features = ["bundled", "functions"], optional = true }

[dev-dependencies]
tempfile = "3"
